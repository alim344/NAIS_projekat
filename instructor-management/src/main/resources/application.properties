spring.application.name=instructor-management

server.port=${SERVER_PORT:8080}

spring.neo4j.uri=${SPRING_NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD:password123}

spring.neo4j.migrations.enabled=true

instructor.analytics.url=${INSTRUCTOR_ANALYTICS_URL:http://localhost:9090}