version: '3.8'

services:
  #  MILA: BAZA
  neo4j-mila:
    image: neo4j:latest
    container_name: neo4j-mila
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    networks:
      - autoskola-network

  #  MILA: Class Organization
  class-organization:
    build:
      context: ./class-organization
    container_name: class-organization-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j-mila:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password123
      - SERVER_PORT=8080
    depends_on:
      - neo4j-mila
    networks:
      - autoskola-network

  # TANJA: BAZA
  neo4j-tanja:
    image: neo4j:latest
    container_name: neo4j-tanja
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j_data_tanja:/data
      - ./neo4j_logs_tanja:/logs
    networks:
      - autoskola-network

  # TANJA: Instructor Management
  instructor-management:
    build: ./instructor-management
    container_name: instructor-management-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j-tanja:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password123
      - SERVER_PORT=8080
    depends_on:
      - neo4j-tanja
    networks:
      - autoskola-network


networks:
  autoskola-network:
    driver: bridge