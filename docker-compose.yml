
services:
  neo4j-mila:
    image: neo4j:latest
    container_name: neo4j-mila
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j_mila_data:/data
    networks:
      - autoskola-network

  rabbitmq-mila:
    image: rabbitmq:3-management
    container_name: rabbitmq-mila
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    networks:
      - autoskola-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  class-organization:
    build:
      context: ./class-organization
    container_name: class-organization-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j-mila:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password123
      - SPRING_RABBITMQ_HOST=rabbitmq-mila
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      neo4j-mila:
        condition: service_started
      rabbitmq-mila:
        condition: service_healthy
    networks:
      - autoskola-network

  neo4j-sara:
    image: neo4j:latest
    container_name: neo4j-sara
    ports:
      - "7480:7474"
      - "7690:7687"
    environment:
      - NEO4J_AUTH=neo4j/sara123!
    volumes:
      - ./neo4j_sara_data:/data
    networks:
      - autoskola-network

  theory-organization:
    build:
      context: ./theory_organization
    container_name: theory-organization-service
    ports:
      - "8090:8090"
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j-sara:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=sara123!
      - SERVER_PORT=8090
    depends_on:
      - neo4j-sara
    networks:
      - autoskola-network


  # TANJA: BAZA
  neo4j-tanja:
    image: neo4j:latest
    container_name: neo4j-tanja
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j_data_tanja:/data
      - ./neo4j_logs_tanja:/logs
    networks:
      - autoskola-network

  # TANJA: Instructor Management
  instructor-management:
    build: ./instructor-management
    container_name: instructor-management-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j-tanja:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password123
      - SERVER_PORT=8080
      - INSTRUCTOR_ANALYTICS_URL=http://instructor-analytics-service:9090
    depends_on:
      - neo4j-tanja
      - instructor-analytics
    networks:
      - autoskola-network

  #TANJA: elasticsearch
  elasticsearch-instructor:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
      container_name: elasticsearch-instructor
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      ports:
        - "9200:9200"
      volumes:
        - ./elasticsearch_instructor_data:/usr/share/elasticsearch/data
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
      networks:
        - autoskola-network   


  elasticsearch-mila:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch_db
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" 
    ports:
      - "9209:9200"
    networks:
      - autoskola-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    

  #TANJA: instructor analytics
  instructor-analytics:
    build: ./instructor-analytics
    container_name: instructor-analytics-service
    ports:
      - "9090:9090"
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch-instructor:9200
      - SPRING_DATA_REDIS_HOST=redis-tanja
      - SPRING_DATA_REDIS_PORT=6379
      - SERVER_PORT=9090
    depends_on:
      elasticsearch-instructor:
        condition: service_healthy
      redis-tanja:
        condition: service_started
    restart: on-failure
    networks:
      - autoskola-network

  redis-tanja:
    image: redis:latest
    container_name: redis-tanja
    ports:
      - "6379:6379"
    networks:
      - autoskola-network

  elasticsearch-sara:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch-sara
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9208:9200"
    volumes:
      - ./elasticsearch_sara_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - autoskola-network

  redis-sara:
    image: redis:7.2
    container_name: redis-sara
    ports:
      - "6380:6379"
    volumes:
      - ./redis_sara_data:/data
    networks:
      - autoskola-network

  theory-search-service:
    build:
      context: ./theory-search-service
    container_name: theory-search-service
    restart: on-failure
    ports:
      - "8092:8092"
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch-sara:9200
      - SPRING_DATA_REDIS_HOST=redis-sara
      - SPRING_DATA_REDIS_PORT=6379
      - SERVER_PORT=8092
    depends_on:
      elasticsearch-sara:
        condition: service_healthy
      redis-sara:
        condition: service_started
    networks:
      - autoskola-network

      
 
  practical-class-es:
    build:
      context: ./practical-class-es 
      dockerfile: Dockerfile
    container_name: practical_class_es_app
    ports:
      - "8085:8080" 
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch-mila:9200
      - SPRING_DATA_REDIS_HOST=redis-mila
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq-mila
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      elasticsearch-mila:
        condition: service_healthy
      redis-mila:
        condition: service_healthy
      rabbitmq-mila:
        condition: service_healthy
    networks:
      - autoskola-network

  redis-mila:
      image: redis:7-alpine
      container_name: redis-mila
      ports:
        - "6381:6379"
      networks:
        - autoskola-network
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
  

  theory-saga:
    build:
      context: ./theory_saga
    container_name: theory-saga-service
    ports:
      - "8095:8095"
    environment:
      - SERVER_PORT=8095
      - SERVICES_THEORY_ORGANIZATION_URL=http://theory-organization-service:8090
      - SERVICES_THEORY_SEARCH_URL=http://theory-search-service:8092
    depends_on:
      - theory-organization
      - theory-search-service
    networks:
      - autoskola-network

networks:
  autoskola-network:
    driver: bridge